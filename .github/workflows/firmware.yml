name: Build T5 preview firmware
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'profiles/**'
      - 'tools/apply_profile.py'
      - 'tools/stage_tuya.py'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
    inputs:
      profile_json:
        description: 'Optional pet profile JSON from the customization studio. Empty uses Milo.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      OPEN_COUNTRY_CODE: Other
      TUYAOPEN_CN_DOWNLOAD: '0'
      TUYAOPEN_EXPORT_IDE: '1'
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Check engine and profile
        run: |
          sh tools/test.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Apply pet profile
        env:
          PEBBLE_PROFILE_JSON: ${{ inputs.profile_json }}
        run: python3 tools/apply_profile.py --from-env
      - name: Checkout pinned TuyaOpen SDK
        uses: actions/checkout@v4
        with:
          repository: tuya/TuyaOpen
          ref: cc6b7cdc35f0168186859c02b4979e9580b3a760
          path: vendor/TuyaOpen
          submodules: recursive
          persist-credentials: false
      - name: Install Linux host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build wget git python3 python3-pip python3-venv libc6-i386 libsystemd-dev libusb-1.0-0-dev locales
      - name: Stage application
        run: python3 tools/stage_tuya.py "$GITHUB_WORKSPACE/vendor/TuyaOpen"
      - name: Build exact T5 board
        shell: bash
        run: |
          set -eo pipefail
          cd vendor/TuyaOpen
          mkdir -p .cache
          touch .cache/.dont_prompt_update_platform
          . ./export.sh
          tos.py check
          cd examples/pebble_microos
          tos.py config choice -c WAVESHARE_T5AI_TOUCH_AMOLED_1_75.config
          tos.py build 2>&1 | tee "$GITHUB_WORKSPACE/firmware-build.log"
      - name: Collect preview artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess
          root = Path('vendor/TuyaOpen/examples/pebble_microos')
          files = list((root / 'dist').rglob('*.bin'))
          if not files:
              files = list((root / '.build/bin').rglob('*.bin'))
          if not files:
              raise SystemExit('Build produced no firmware BIN; failing release packaging.')
          target = Path('build/firmware'); target.mkdir(parents=True, exist_ok=True)
          manifest = []
          for index, source in enumerate(files):
              name = source.name
              if (target / name).exists():
                  name = str(index) + '-' + name
              output = target / name; shutil.copy2(source, output)
              manifest.append({'file':name, 'size':output.stat().st_size, 'sha256':hashlib.sha256(output.read_bytes()).hexdigest()})
          (target / 'manifest.json').write_text(json.dumps({'version':'0.3.0-preview.1', 'sourceCommit':os.environ['GITHUB_SHA'], 'buildRun':os.environ['GITHUB_RUN_ID'], 'sdkCommit':'cc6b7cdc35f0168186859c02b4979e9580b3a760', 'board':'WAVESHARE_T5AI_TOUCH_AMOLED_1_75', 'hardwareTested':False, 'files':manifest}, indent=2))
          shutil.copy2('firmware/include/pebble_profile.h', target / 'pebble_profile.h')
          shutil.copy2('docs/HARDWARE_AND_BUILD.md', target / 'INSTALL.md')
          shutil.copy2('docs/CONNECTIVITY.md', target / 'CONNECTIVITY.md')
          shutil.copy2('THIRD_PARTY_NOTICES.md', target / 'THIRD_PARTY_NOTICES.md')
          sdk = Path('vendor/TuyaOpen')
          for directory, folders, names in os.walk(sdk):
              folders[:] = [name for name in folders if name not in {'.git', '.build', 'build', '.cache', '.venv'}]
              for name in names:
                  source = Path(directory) / name
                  if name.upper().startswith(('LICENSE', 'COPYING', 'NOTICE')) and source.is_file() and source.stat().st_size < 1000000:
                      destination = target / 'upstream-notices' / source.relative_to(sdk)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, destination)
          (target / 'upstream-revisions.txt').write_text(subprocess.check_output(['git','-C',str(sdk),'submodule','status','--recursive'],text=True))
          shutil.make_archive('build/pebble-t5-preview', 'zip', target)
          Path('build/release-notes.md').write_text('Engineering preview for Waveshare T5-E1-Touch-AMOLED-1.75. Full ARM build and automated tests passed; physical-device testing is pending.\n\nAdds retained touch controls, cropped display updates, an animated bunny pet, 2.4 GHz Wi-Fi station setup, internet/phone/manual clock setting, and a three-minute Bluetooth LE customization window. Pet Studio can send name, color, eyes and focus settings over BLE.\n\nThe ZIP contains firmware images, SHA-256 manifest, build provenance, installation instructions and upstream notices. Use the T5 QIO image with the official T5 tool; do not use ESP32 tools. The SDK filename suffix 1.0.0 is its packaging default; application version is recorded in the manifest.\n\nThe owner confirmed v0.2 boot and touch, with lag. This new v0.3 build still needs physical-device validation. Timer and clock run while powered; Wi-Fi or phone can restore time after reboot. Hardware RTC restore, battery readings, deep sleep and sound remain pending. Bluetooth is a BLE settings bridge, not audio or Classic pairing.\n\n[Pet Studio](https://anzex7-del.github.io/pebble-microos/) · [Installation guide](https://github.com/anzex7-del/pebble-microos/blob/main/docs/HARDWARE_AND_BUILD.md)\n')
          PY
      - name: Upload compiled preview
        uses: actions/upload-artifact@v4
        with:
          name: pebble-t5-0.3.0-preview.1-${{ github.run_number }}
          path: build/firmware/
          if-no-files-found: error
          retention-days: 90
      - name: Publish default preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-build-${GITHUB_RUN_NUMBER}" build/pebble-t5-preview.zip --target "$GITHUB_SHA" --title "Pebble 0.3 — T5 preview build ${GITHUB_RUN_NUMBER}" --prerelease --notes-file build/release-notes.md
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t5-build-log-${{ github.run_number }}
          path: firmware-build.log
          if-no-files-found: ignore

name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core-and-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sh tools/test.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/run-browser-tests.cjs
